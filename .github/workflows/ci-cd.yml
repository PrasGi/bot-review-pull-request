# .github/workflows/ci-cd.yml
# CI on every PR and push; deploy to the VPS (server-pras-1) on push to main.
#
# Deploy secrets come from `srv deploy-key personal/bot-review` on the server:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SCOPE, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY
# Runtime env lives in /workspace/personal/bot-review/shared/.env on the server
# (edit with `srv env edit personal/bot-review`); CI never writes it.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04 # same OS/arch as the server, so native modules (argon2) match
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      # `next build` generates next-env.d.ts and route types, so typecheck runs after it.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm typecheck

      # Standalone output: server.js + traced node_modules. Tar keeps pnpm's symlinks,
      # which upload-artifact would otherwise flatten.
      - name: Assemble release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf release
          cp -a .next/standalone release
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          if [ -d public ]; then cp -a public release/public; fi
          tar -czf release.tgz -C release .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: release
          path: release.tgz
          retention-days: 3

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://bot-review.prasme.id
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - run: mkdir release && tar -xzf release.tgz -C release

      - name: Upload and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SCOPE: ${{ secrets.DEPLOY_SCOPE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          rsync -az --delete -e "$SSH" release/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/workspace/$DEPLOY_SCOPE/releases/$GITHUB_SHA/"
          # srv-deploy switches `current`, reloads PM2, health-checks /api/health and rolls back on failure.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" srv-deploy "$GITHUB_SHA"

      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://bot-review.prasme.id/api/health
