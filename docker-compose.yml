# bot-review-pull-request — https://bot-review.prasme.id
# MongoDB is the shared `mongodb` container on server-network. Redis is unused.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bot-review-pull-request-app:latest
    container_name: bot-review-pull-request
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3290}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js standalone binds to localhost without this and nginx cannot reach it
      HOSTNAME: "0.0.0.0"
    networks:
      - server-network
    # A review triggered by after() can run up to ~300s. Give in-flight work a
    # chance to drain on redeploy instead of killing it mid-review.
    stop_grace_period: 120s
    healthcheck:
      # node:22-slim ships no wget/curl. 127.0.0.1 rather than localhost, which
      # resolves to ::1 first and fails even when the app is healthy.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  server-network:
    external: true
