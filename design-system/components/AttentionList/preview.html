<!doctype html>
<html>
<head><meta charset="utf-8"><title>AttentionList — preview</title>

<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;

    h(P.AttentionList, null,
      h(P.AttentionItem, { tone: 'warning', icon: 'plug', title: '2 accounts need reconnecting', tags: ['prasgi', 'weyoco'], action: { label: 'Manage in Projects' } }),

      h(P.AttentionItem, { tone: 'neutral', icon: 'wifiOff', title: '1 repository has no recent webhook events', tags: ['weyoco/avora'], action: { label: 'Check webhook config' } }),
      h(P.AttentionItem, { tone: 'error', title: '3 failed reviews in the last 24h', action: { label: 'View failed requests' } })),
