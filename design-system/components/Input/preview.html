<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(P.Input, { label: 'Repository', placeholder: 'owner/repo', hint: 'Must be installed on the GitHub App.' }),
    h(P.Input, { label: 'Webhook secret', defaultValue: 'abc', error: 'At least 16 characters.' }),
    h(P.Input, { label: 'Owner', defaultValue: 'PrasGi', disabled: true })));
</script>
</body>
</html>
