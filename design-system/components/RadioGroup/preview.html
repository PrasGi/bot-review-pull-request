<!doctype html>
<html>
<head><meta charset="utf-8"><title>RadioGroup — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(P.RadioGroup, { label: 'Personality', orientation: 'horizontal', defaultValue: 'professional',
    options: [{ value: 'chill', label: 'chill' }, { value: 'normal', label: 'normal' }, { value: 'professional', label: 'professional' }, { value: 'expert', label: 'expert' }] }));
</script>
</body>
</html>
