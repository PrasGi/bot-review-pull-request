<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(P.Badge, { variant: 'success' }, '✓ Approve'),
    h(P.Badge, { variant: 'error' }, '✕ Request changes'),
    h(P.Badge, { variant: 'warning' }, '! Comment'),
    h(P.Badge, { variant: 'info' }, 'Queued'),
    h(P.Badge, { variant: 'accent' }, 'expert'),
    h(P.Badge, null, 'GLM')));
</script>
</body>
</html>
