<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  body{padding-top:56px} .row{justify-content:center}
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(P.Tooltip, { content: 'Re-run the review on the latest commit', open: true }, h(P.Button, { variant: 'secondary', size: 'sm' }, 'Retry')),
    h(P.Tooltip, { content: 'Hover me too' }, h(P.Button, { variant: 'ghost', size: 'sm' }, 'Hover'))));
</script>
</body>
</html>
