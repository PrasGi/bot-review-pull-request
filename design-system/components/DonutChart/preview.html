<!-- @dsCard group="Charts" height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DonutChart — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  var VERD = [{ label: 'Approve', value: 94, tone: 'success' }, { label: 'Request changes', value: 22, tone: 'error' }, { label: 'Comment', value: 12, tone: 'warning' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h(P.ChartCard, { title: 'Verdict distribution' }, h(P.DonutChart, { data: VERD, centerLabel: 'reviews' })));
</script>
</body>
</html>
