<!doctype html>
<html>
<head><meta charset="utf-8"><title>SummaryCard — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' },
    h(P.SummaryCard, { label: 'Total cost', value: '$3.4218' }), h(P.SummaryCard, { label: 'Total calls', value: '1,284' }),
    h(P.SummaryCard, { label: 'Prompt tokens', value: '4.1M' }), h(P.SummaryCard, { loading: true })));
</script>
</body>
</html>
