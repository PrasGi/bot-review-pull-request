<!doctype html>
<html>
<head><meta charset="utf-8"><title>LineChart — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  var COST = ['Sep 1','Sep 4','Sep 7','Sep 10','Sep 13','Sep 16','Sep 19','Sep 22','Sep 25'].map(function (d, i) { return { label: d, value: [0.21,0.34,0.29,0.52,0.48,0.61,0.44,0.72,0.58][i] }; });
  ReactDOM.createRoot(document.getElementById('root')).render(h(P.ChartCard, { title: 'Cost over time' }, h(P.LineChart, { data: COST, height: 220, seriesLabel: 'Cost', format: function (v) { return '$' + v.toFixed(2); } })));
</script>
</body>
</html>
