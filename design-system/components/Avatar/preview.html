<!doctype html>
<html>
<head><meta charset="utf-8"><title>Avatar — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }

<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' }, h(P.Avatar, { name: 'Prasetyo', tone: 'accent' }), h(P.Avatar, { name: 'dina' }), h(P.Avatar, { name: 'Admin', initials: 'AD', size: 32, tone: 'accent' }), h(P.Avatar, { name: 'r', size: 24 })));
