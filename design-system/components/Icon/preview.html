<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }
  .ic{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px} .ic div{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 10px/12px var(--font-mono);color:var(--text-muted)}
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ic' }, P.ICON_NAMES.map(function (n) { return h('div', { key: n }, h(P.Icon, { name: n, size: 20 }), n); })));
</script>
</body>
</html>
