<!doctype html>
<html>
<head><meta charset="utf-8"><title>PageHeader — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col', style: { gap: 28 } },
    h(P.PageHeader, { title: 'Review Requests', description: 'All PR review requests across your repositories', actions: h(P.LiveIndicator) }),
    h(P.PageHeader, { onBack: function () {}, backLabel: 'Back to requests', kicker: 'PrasGi/bot-review-pull-request', title: '#42 Add reply-aware re-review', badge: h(P.Badge, { variant: 'success' }, '✓ Completed') })));
</script>
</body>
</html>
