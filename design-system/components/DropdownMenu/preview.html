<!doctype html>
<html>
<head><meta charset="utf-8"><title>DropdownMenu — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  function Demo() {
    return h('div', { className: 'row' }, h(P.DropdownMenu, { defaultOpen: true, trigger: h(P.Button, { variant: 'secondary' }, 'Account ▾') },
      h(P.DropdownMenuLabel, null, 'prasgi · github'),
      h(P.DropdownMenuItem, null, 'Resync installations'),
      h(P.DropdownMenuItem, null, 'Copy webhook URL'),
      h(P.DropdownMenuItem, { disabled: true }, 'Transfer (owner only)'),
      h(P.DropdownMenuSeparator),
      h(P.DropdownMenuItem, { destructive: true }, 'Disconnect account')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
