<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton — preview</title>
<style>
  body { margin:0; padding:20px 24px 28px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; align-items:start; }
  
</style></head>
<body>
<div id="root"></div>
<script>
  var P = window.PRR, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(P.Card, { style: { maxWidth: 360 } }, h('div', { className: 'col', style: { gap: 10 } },
    h(P.Skeleton, { style: { width: '40%', height: 12 } }),
    h(P.Skeleton, { style: { width: '70%', height: 24 } }),
    h(P.Skeleton, { style: { width: '100%' } }))));
</script>
</body>
</html>
